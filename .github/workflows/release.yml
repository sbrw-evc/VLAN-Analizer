name: Release and publish Docker package
on:
  push:
    branches: [main]
    tags: ['v[0-9]*']
    paths: [pyproject.toml, '.github/workflows/release.yml']
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version, for example v0.2.0 (must match pyproject.toml)'
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}-${{ inputs.version }}
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      image: ${{ steps.version.outputs.image }}
      sha: ${{ steps.version.outputs.sha }}
      prerelease: ${{ steps.version.outputs.prerelease }}
      exists: ${{ steps.existing.outputs.exists }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
          REPOSITORY: ${{ github.repository }}
        run: |
          python - <<'PY'
          import os, re, subprocess, tomllib
          with open('pyproject.toml', 'rb') as stream:
              project = tomllib.load(stream)['project']['version']
          version = os.environ['INPUT_VERSION'] or (os.environ['GITHUB_REF_NAME'] if os.environ['GITHUB_REF_TYPE'] == 'tag' else 'v' + project)
          if not re.fullmatch(r'v\d+\.\d+\.\d+(?:-(?:alpha|beta|rc)\.\d+)?', version):
              raise SystemExit('Use a semantic version such as v0.2.0 or v0.2.0-rc.1')
          if version.split('-')[0][1:] != project:
              raise SystemExit('Release tag must match the project version')
          sha = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          if os.environ['GITHUB_EVENT_NAME'] == 'workflow_dispatch':
              main = subprocess.check_output(['git', 'rev-parse', 'origin/main'], text=True).strip()
              if sha != main:
                  raise SystemExit('Manual releases must run against the current main branch')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as stream:
              stream.write(f'version={version}\nimage=ghcr.io/{os.environ["REPOSITORY"].lower()}\nsha={sha}\nprerelease={str("-" in version).lower()}\n')
          PY
      - id: existing
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if gh release view "$VERSION" >/dev/null 2>&1; then
            echo 'exists=true' >> "$GITHUB_OUTPUT"
          else
            echo 'exists=false' >> "$GITHUB_OUTPUT"
          fi
  test:
    if: needs.validate.outputs.exists != 'true'
    needs: validate
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read
  publish:
    if: needs.validate.outputs.exists != 'true'
    needs: [validate, test]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.validate.outputs.sha }}
          fetch-depth: 0
      - name: Refuse replacing a published release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          if gh release view "$VERSION" >/dev/null 2>&1; then
            echo 'Release already exists; choose a new version.' >&2
            exit 1
          fi
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ needs.validate.outputs.image }}
          flavor: latest=false
          tags: |
            type=raw,value=${{ needs.validate.outputs.version }}
            type=semver,pattern={{version}},value=${{ needs.validate.outputs.version }}
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.validate.outputs.version }},enable=${{ needs.validate.outputs.prerelease == 'false' }}
            type=raw,value=latest,enable=${{ needs.validate.outputs.prerelease == 'false' }}
      - uses: docker/build-push-action@v6
        id: build
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=release
          cache-to: type=gha,mode=max,scope=release
      - name: Package installation files and release notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.validate.outputs.version }}
          IMAGE: ${{ needs.validate.outputs.image }}
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
          TARGET_SHA: ${{ needs.validate.outputs.sha }}
        run: |
          mkdir release-assets
          cp compose.yaml .env.example release-assets/
          cp README.md release-assets/README.md
          cp -r docs release-assets/docs
          mkdir -p release-assets/deploy
          cp deploy/prepare.py deploy/bao.hcl deploy/bao-policy.hcl release-assets/deploy/
          python - <<'PY'
          import os, pathlib
          version, image, digest = (os.environ[k] for k in ('VERSION', 'IMAGE', 'IMAGE_DIGEST'))
          path = pathlib.Path('release-assets/.env.example')
          path.write_text(path.read_text().replace('VLAN_ANALIZER_VERSION=latest', 'VLAN_ANALIZER_VERSION='+version))
          pathlib.Path('release-assets/IMAGE.txt').write_text(f'{image}:{version}\n{image}@{digest}\n')
          pathlib.Path('release-notes.md').write_text(f'## Docker package\n\n`{image}:{version}`\n\nPlatforms: Linux amd64 and arm64.\n\nDigest: `{digest}`\n\nDownload `vlan-analizer-install.tar.gz`, extract it, copy `.env.example` to `.env`, then run `docker compose pull && docker compose up -d`. Initial OpenBao/ClickHouse/admin/Entra setup runs in the browser. See README for bundled services and setup access key.\n\n')
          PY
          tar -czf vlan-analizer-install.tar.gz -C release-assets .
          sha256sum vlan-analizer-install.tar.gz > SHA256SUMS
          if gh release view "$VERSION" >/dev/null 2>&1; then
            echo 'Release already exists; refusing to replace published assets.' >&2
            exit 1
          fi
          release_args=()
          if [ '${{ needs.validate.outputs.prerelease }}' = true ]; then release_args+=(--prerelease); fi
          gh release create "$VERSION" vlan-analizer-install.tar.gz SHA256SUMS --target "$TARGET_SHA" --title "VLAN Analizer $VERSION" --generate-notes --notes-file release-notes.md "${release_args[@]}"
