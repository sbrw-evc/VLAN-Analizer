name: Release and publish Docker package
on:
  push:
    branches: [main]
    tags: ['v[0-9]*']
    paths: [VERSION, '.github/workflows/release.yml']
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version, for example v0.3.0 (must match VERSION)'
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}-${{ inputs.version }}
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      image: ${{ steps.version.outputs.image }}
      sha: ${{ steps.version.outputs.sha }}
      prerelease: ${{ steps.version.outputs.prerelease }}
      exists: ${{ steps.existing.outputs.exists }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
          REPOSITORY: ${{ github.repository }}
        run: |
          node <<'JS'
          const fs=require('fs'), cp=require('child_process');
          const project=fs.readFileSync('VERSION','utf8').trim();
          const env=process.env;
          const version=env.INPUT_VERSION || (env.GITHUB_REF_TYPE==='tag'?env.GITHUB_REF_NAME:'v'+project);
          if(!/^v\d+\.\d+\.\d+(?:-(?:alpha|beta|rc)\.\d+)?$/.test(version))throw new Error('Use a semantic version such as v0.3.0');
          if(version.split('-')[0].slice(1)!==project)throw new Error('Release tag must match VERSION');
          const sha=cp.execFileSync('git',['rev-parse','HEAD'],{encoding:'utf8'}).trim();
          if(env.GITHUB_EVENT_NAME==='workflow_dispatch' && sha!==cp.execFileSync('git',['rev-parse','origin/main'],{encoding:'utf8'}).trim())throw new Error('Manual releases must use current main');
          fs.appendFileSync(env.GITHUB_OUTPUT,`version=${version}\nimage=ghcr.io/${env.REPOSITORY.toLowerCase()}\nsha=${sha}\nprerelease=${version.includes('-')}\n`);
          JS
      - id: existing
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if gh release view "$VERSION" >/dev/null 2>&1; then
            echo 'exists=true' >> "$GITHUB_OUTPUT"
          else
            echo 'exists=false' >> "$GITHUB_OUTPUT"
          fi
  test:
    if: needs.validate.outputs.exists != 'true'
    needs: validate
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read
  publish:
    if: needs.validate.outputs.exists != 'true'
    needs: [validate, test]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.validate.outputs.sha }}
          fetch-depth: 0
      - name: Refuse replacing a published release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          if gh release view "$VERSION" >/dev/null 2>&1; then
            echo 'Release already exists; choose a new version.' >&2
            exit 1
          fi
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ needs.validate.outputs.image }}
          flavor: latest=false
          tags: |
            type=raw,value=${{ needs.validate.outputs.version }}
            type=semver,pattern={{version}},value=${{ needs.validate.outputs.version }}
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.validate.outputs.version }},enable=${{ needs.validate.outputs.prerelease == 'false' }}
            type=raw,value=latest,enable=${{ needs.validate.outputs.prerelease == 'false' }}
      - uses: docker/build-push-action@v6
        id: build
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=release
          cache-to: type=gha,mode=max,scope=release
      - name: Package installation files and release notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.validate.outputs.version }}
          IMAGE: ${{ needs.validate.outputs.image }}
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
          TARGET_SHA: ${{ needs.validate.outputs.sha }}
        run: |
          mkdir release-assets
          cp compose.yaml release-assets/compose.yaml
          cp README.md release-assets/README.md
          cp -r docs release-assets/docs
          node <<'JS'
          const fs=require('fs');
          const {VERSION:version,IMAGE:image,IMAGE_DIGEST:digest}=process.env;
          const path='release-assets/compose.yaml';
          fs.writeFileSync(path,fs.readFileSync(path,'utf8').replace(':-latest}',':-'+version+'}'));
          fs.writeFileSync('release-notes.md',`## Docker package\n\n\`${image}:${version}\`\n\nPlatform: Linux amd64.\n\nDigest: \`${digest}\`\n\nDownload \`compose.yaml\` and run \`docker compose up -d\`. Open http://your-linux-host:8000 and complete the browser wizard. No .env, host preparation scripts, database passwords or OpenBao CLI steps are required.\n\nThe \`netagent\` service runs privileged with the host PID namespace to create and persist VLAN interfaces through netplan, NetworkManager, ifupdown or network-scripts (Debian, Ubuntu, CentOS, RHEL). It has no network and is reachable only through a socket shared with the application; remove it from compose.yaml to disable VLAN management. See docs/vlans.md in the documentation archive.\n\nThe documentation archive is optional; compose.yaml is sufficient for installation.\n\n`);
          JS
          tar -czf vlan-analizer-install.tar.gz -C release-assets .
          cp release-assets/compose.yaml compose.yaml
          sha256sum compose.yaml vlan-analizer-install.tar.gz > SHA256SUMS
          if gh release view "$VERSION" >/dev/null 2>&1; then
            echo 'Release already exists; refusing to replace published assets.' >&2
            exit 1
          fi
          release_args=()
          if [ '${{ needs.validate.outputs.prerelease }}' = true ]; then release_args+=(--prerelease); fi
          gh release create "$VERSION" compose.yaml vlan-analizer-install.tar.gz SHA256SUMS --target "$TARGET_SHA" --title "VLAN Analizer $VERSION" --generate-notes --notes-file release-notes.md "${release_args[@]}"
