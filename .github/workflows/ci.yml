name: Validate application
on:
  push:
    branches: [main, 'feat/**']
  pull_request:
  workflow_call:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.3'
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            web/package-lock.json
      - name: Check formatting and static analysis
        run: |
          test -z "$(gofmt -l cmd internal web/embed.go)"
          go vet ./...
      - name: Type-check, test and build the web app
        working-directory: web
        run: |
          npm ci --no-audit --no-fund
          npm test
          npm run build
      - run: go test -race ./...
      - run: go build -o /tmp/vlan-analizer-ci ./cmd/vlan-analizer
      - name: Start disposable Kuma-compatible database
        run: |
          docker run -d --name test-kuma-db -p 127.0.0.1:3307:3306 -e MARIADB_ROOT_PASSWORD=integration-root-password -e MARIADB_DATABASE=kuma mariadb:11.4
          for attempt in $(seq 1 60); do
            if docker exec test-kuma-db healthcheck.sh --connect --innodb_initialized; then exit 0; fi
            sleep 2
          done
          exit 1
      - run: RUN_KUMA_TESTS=1 go test -v ./internal/app -run TestMariaDBIntegration
      - run: docker build -t vlan-analizer:ci .
      - name: Check Chromium inside the production image
        run: |
          CGO_ENABLED=0 go test -c -o /tmp/vlan-app.test ./internal/app
          docker run --rm --network host --cap-drop ALL --cap-add NET_RAW -e RUN_BROWSER_TESTS=1 -v /tmp/vlan-app.test:/test:ro --entrypoint /test vlan-analizer:ci -test.v -test.run TestChromiumIntegration
      - name: Install browser test dependencies
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Install from a standalone Compose file without .env
        run: |
          mkdir -p /tmp/vlan-fresh-install
          cp compose.yaml /tmp/vlan-fresh-install/compose.yaml
          cat > /tmp/vlan-fresh-install/override.yaml <<'YAML'
          services:
            prepare:
              image: vlan-analizer:ci
            bootstrap:
              image: vlan-analizer:ci
            netagent:
              image: vlan-analizer:ci
            app:
              image: vlan-analizer:ci
          YAML
          cd /tmp/vlan-fresh-install
          test ! -f .env
          docker compose -p vlan-ci -f compose.yaml -f override.yaml config --quiet
          docker compose -p vlan-ci -f compose.yaml -f override.yaml up -d
          docker cp "$(docker compose -p vlan-ci -f compose.yaml -f override.yaml ps -q app)":/bootstrap/addresses.json /tmp/vlan-managed-addresses.json
          curl -fsS "http://$(jq -r '.["managed-openbao:8200"]' /tmp/vlan-managed-addresses.json)/v1/sys/seal-status"
          curl -fsS "http://$(jq -r '.["managed-clickhouse:8123"]' /tmp/vlan-managed-addresses.json)/ping"
      - run: npm run test:ui
      - name: Verify real ClickHouse and OpenBao round trips
        run: |
          docker cp "$(docker compose -p vlan-ci -f /tmp/vlan-fresh-install/compose.yaml -f /tmp/vlan-fresh-install/override.yaml ps -q app)":/bootstrap/managed.json /tmp/vlan-managed-test.json
          MANAGED_ADDRESS_FILE=/tmp/vlan-managed-addresses.json MANAGED_TEST_CONFIG=/tmp/vlan-managed-test.json go test -v ./internal/app -run TestManagedStorageIntegration
          rm -f /tmp/vlan-managed-test.json /tmp/vlan-managed-addresses.json
      - name: Restart storage and application
        run: |
          cd /tmp/vlan-fresh-install
          docker compose -p vlan-ci -f compose.yaml -f override.yaml restart openbao app
      - run: MODE=verify npm run test:ui
      - name: Prepare a disposable trunk for VLAN tests
        run: |
          # A process in its own network and mount namespaces holds a bridge named trunk0. The runner's netplan and
          # ifupdown files are hidden there, so netagent uses the runtime backend and never touches the runner's network.
          sudo modprobe 8021q
          sudo setsid unshare --net --mount --propagation private sh -c '
            if [ -d /etc/netplan ]; then mount -t tmpfs tmpfs /etc/netplan; fi
            if [ -d /etc/network ]; then mount -t tmpfs tmpfs /etc/network; fi
            ip link set lo up
            ip link add trunk0 type bridge
            ip link set trunk0 up
            echo $$ > /tmp/vlan-netns.pid
            exec sleep 3600' > /tmp/vlan-netns.log 2>&1 < /dev/null &
          for attempt in $(seq 1 20); do test -s /tmp/vlan-netns.pid && break; sleep 0.5; done
          cat /tmp/vlan-netns.log
          sudo nsenter -t "$(cat /tmp/vlan-netns.pid)" -n ip -br link
          cat > /tmp/vlan-fresh-install/agent.yaml <<YAML
          services:
            netagent:
              environment:
                NETAGENT_HOST_PID: "$(cat /tmp/vlan-netns.pid)"
          YAML
          cd /tmp/vlan-fresh-install
          docker compose -p vlan-ci -f compose.yaml -f override.yaml -f agent.yaml up -d netagent
      - name: Create, change and delete real VLAN interfaces in the browser
        run: npm run test:vlans
      - name: Verify the kernel and host files after deletion
        run: |
          pid="$(cat /tmp/vlan-netns.pid)"
          if sudo nsenter -t "$pid" -n ip link show trunk0.20; then echo 'trunk0.20 survived deletion' >&2; exit 1; fi
          test "$(sudo jq '.interfaces | length' /etc/vlan-analizer/vlans.json)" = 0
          test ! -e /etc/sysctl.d/90-vlan-analizer.conf
      - name: Collect diagnostic logs
        if: failure()
        run: |
          mkdir -p test-results
          docker compose -p vlan-ci -f /tmp/vlan-fresh-install/compose.yaml -f /tmp/vlan-fresh-install/override.yaml logs --no-color > test-results/compose.log 2>&1 || true
          tail -n 100 test-results/compose.log
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: integration-diagnostics
          path: test-results
      - name: Clean disposable services
        if: always()
        run: |
          docker compose -p vlan-ci -f /tmp/vlan-fresh-install/compose.yaml -f /tmp/vlan-fresh-install/override.yaml down -v || true
          docker rm -f test-kuma-db || true
          if [ -s /tmp/vlan-netns.pid ]; then sudo kill "$(cat /tmp/vlan-netns.pid)" || true; fi
          sudo rm -rf /etc/vlan-analizer /etc/sysctl.d/90-vlan-analizer.conf
