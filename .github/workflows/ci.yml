name: Validate application
on:
  push:
    branches: [main, 'feat/**']
  pull_request:
  workflow_call:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.3'
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Check formatting and static analysis
        run: |
          test -z "$(gofmt -l cmd internal web/embed.go)"
          go vet ./...
          node --check web/static/app.js
          node --check web/static/setup.js
      - run: go test -race ./...
      - run: go build ./cmd/vlan-analizer
      - name: Start disposable Kuma-compatible database
        run: |
          docker run -d --name test-kuma-db -p 127.0.0.1:3307:3306 -e MARIADB_ROOT_PASSWORD=integration-root-password -e MARIADB_DATABASE=kuma mariadb:11.4
          for attempt in $(seq 1 60); do
            if docker exec test-kuma-db healthcheck.sh --connect --innodb_initialized; then exit 0; fi
            sleep 2
          done
          exit 1
      - run: RUN_KUMA_TESTS=1 go test -v ./internal/app -run TestMariaDBIntegration
      - run: docker build -t vlan-analizer:ci .
      - name: Check Chromium inside the production image
        run: |
          CGO_ENABLED=0 go test -c -o /tmp/vlan-app.test ./internal/app
          docker run --rm --network host --cap-drop ALL --cap-add NET_RAW -e RUN_BROWSER_TESTS=1 -v /tmp/vlan-app.test:/test:ro --entrypoint /test vlan-analizer:ci -test.v -test.run TestChromiumIntegration
      - name: Install browser test dependencies
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Install from a standalone Compose file without .env
        run: |
          mkdir -p /tmp/vlan-fresh-install
          cp compose.yaml /tmp/vlan-fresh-install/compose.yaml
          cat > /tmp/vlan-fresh-install/override.yaml <<'YAML'
          services:
            prepare:
              image: vlan-analizer:ci
            bootstrap:
              image: vlan-analizer:ci
            app:
              image: vlan-analizer:ci
          YAML
          cd /tmp/vlan-fresh-install
          test ! -f .env
          docker compose -p vlan-ci -f compose.yaml -f override.yaml config --quiet
          docker compose -p vlan-ci -f compose.yaml -f override.yaml up -d
      - run: npm run test:ui
      - name: Verify real ClickHouse and OpenBao round trips
        run: |
          docker cp "$(docker compose -p vlan-ci -f /tmp/vlan-fresh-install/compose.yaml -f /tmp/vlan-fresh-install/override.yaml ps -q app)":/bootstrap/managed.json /tmp/vlan-managed-test.json
          MANAGED_TEST_CONFIG=/tmp/vlan-managed-test.json go test -v ./internal/app -run TestManagedStorageIntegration
          rm -f /tmp/vlan-managed-test.json
      - name: Restart storage and application
        run: |
          cd /tmp/vlan-fresh-install
          docker compose -p vlan-ci -f compose.yaml -f override.yaml restart openbao app
      - run: MODE=verify npm run test:ui
      - name: Collect diagnostic logs
        if: failure()
        run: |
          mkdir -p test-results
          docker compose -p vlan-ci -f /tmp/vlan-fresh-install/compose.yaml -f /tmp/vlan-fresh-install/override.yaml logs --no-color > test-results/compose.log 2>&1 || true
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: integration-diagnostics
          path: test-results
      - name: Clean disposable services
        if: always()
        run: |
          docker compose -p vlan-ci -f /tmp/vlan-fresh-install/compose.yaml -f /tmp/vlan-fresh-install/override.yaml down -v || true
          docker rm -f test-kuma-db || true
