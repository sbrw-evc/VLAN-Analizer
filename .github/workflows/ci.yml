name: Validate application
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.lock
      - run: pip install -r requirements.lock && pip install -e '.[test]'
      - run: ruff check app deploy tests
      - run: pytest -q
      - run: playwright install --with-deps chromium
      - run: RUN_BROWSER_TESTS=1 pytest -q tests/test_runtime.py -k browser
      - run: python tests/ui_smoke.py
      - name: Start disposable integration storage
        run: |
          docker run -d --name test-ch -p 127.0.0.1:8123:8123 -e CLICKHOUSE_USER=vlan -e CLICKHOUSE_PASSWORD=integration-test-password clickhouse/clickhouse-server:25.8
          docker run -d --name test-bao -p 127.0.0.1:8200:8200 -e BAO_DEV_ROOT_TOKEN_ID=integration-test-token openbao/openbao:2.4.4 server -dev -dev-listen-address=0.0.0.0:8200
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8123/ping && curl -fsS http://127.0.0.1:8200/v1/sys/health >/dev/null; then exit 0; fi
            sleep 2
          done
          exit 1
      - run: RUN_STORAGE_TESTS=1 pytest -q tests/test_runtime.py -k storage
      - name: Start disposable Kuma-compatible database
        run: |
          docker run -d --name test-kuma-db -p 127.0.0.1:3307:3306 -e MARIADB_ROOT_PASSWORD=integration-root-password -e MARIADB_DATABASE=kuma -e MARIADB_USER=vlan_reader -e MARIADB_PASSWORD=integration-kuma-password mariadb:11.4
          for attempt in $(seq 1 40); do
            if docker exec test-kuma-db healthcheck.sh --connect --innodb_initialized; then exit 0; fi
            sleep 2
          done
          exit 1
      - run: RUN_KUMA_TESTS=1 pytest -q tests/test_runtime.py -k kuma
      - run: docker build -t vlan-analizer:test .
      - name: Validate Compose configuration
        run: |
          cp .env.example .env
          python deploy/prepare.py
          touch secrets/bao_role_id secrets/bao_secret_id
          docker compose config --quiet
