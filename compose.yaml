services:
  app:
    image: vlan-analizer:local
    build: .
    network_mode: host
    restart: unless-stopped
    init: true
    env_file: .env
    environment:
      BAO_ROLE_ID_FILE: /run/secrets/bao_role_id
      BAO_SECRET_ID_FILE: /run/secrets/bao_secret_id
      CLICKHOUSE_URL: http://127.0.0.1:8123
      CLICKHOUSE_USER: vlan
      BAO_ADDR: http://127.0.0.1:8200
    secrets: [bao_role_id, bao_secret_id]
    volumes:
      - /etc/resolv.conf:/etc/resolv.conf:ro
      # Add a read-only Gatus config mount here and set GATUS_CONFIG if needed.
    cap_drop: [ALL]
    cap_add: [NET_RAW]
    security_opt: [no-new-privileges:true]
    read_only: true
    tmpfs:
      - /tmp:size=1G,mode=1777
    shm_size: 256mb
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/readyz', timeout=5)"]
      interval: 30s
      timeout: 10s
      start_period: 60s
    depends_on:
      clickhouse:
        condition: service_healthy
      openbao:
        condition: service_started
  clickhouse:
    image: clickhouse/clickhouse-server:25.8
    restart: unless-stopped
    ports: ["127.0.0.1:8123:8123"]
    environment:
      CLICKHOUSE_USER: vlan
      CLICKHOUSE_PASSWORD_FILE: /run/secrets/clickhouse_password
      CLICKHOUSE_DB: default
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "0"
    secrets: [clickhouse_password]
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - clickhouse_logs:/var/log/clickhouse-server
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test: [CMD, wget, --spider, -q, http://localhost:8123/ping]
      interval: 10s
      timeout: 5s
      retries: 10
  openbao:
    image: openbao/openbao:2.4.4
    command: [server, -config=/openbao/config/bao.hcl]
    restart: unless-stopped
    ports: ["127.0.0.1:8200:8200"]
    environment:
      BAO_ADDR: http://127.0.0.1:8200
    cap_add: [IPC_LOCK]
    volumes:
      - ./deploy/bao.hcl:/openbao/config/bao.hcl:ro
      - bao_data:/openbao/file
volumes:
  clickhouse_data:
  clickhouse_logs:
  bao_data:
secrets:
  clickhouse_password:
    file: ./secrets/clickhouse_password
  bao_role_id:
    file: ./secrets/bao_role_id
  bao_secret_id:
    file: ./secrets/bao_secret_id
